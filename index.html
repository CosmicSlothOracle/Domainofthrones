  <style>
    :root {
      --bg: #030201;
      --bg2: #0e0d0a;
      --panel: #0e0d0a;
      --panel2: #24211a;
      --panel3: #030201;
      --line: #24211a;
      --line2: #3b342e;
      --ink: #fafafa;
      --muted: #d4d8e0;
      --faint: #acacac;
      --faint2: #918b8c;
      --brand: #6b615e;
      --accent: #acacac;
      --red: #ff5a52;
      --amber: #ffb020;
      --orange: #ff8a3d;
      --green: #3ddc84;
      --blue: #4aa3ff;
      --purple: #b08bff;
      --cyan: #3fd6d6;
      --redbg: rgba(255, 90, 82, .1);
      --amberbg: rgba(255, 176, 32, .1);
      --greenbg: rgba(61, 220, 132, .1);
      --bluebg: rgba(74, 163, 255, .1);
      --purplebg: rgba(176, 139, 255, .1);
      --mono: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
      --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --radius: 4px;
      --shadow: 0 1px 0 rgba(250, 250, 250, .04), 0 12px 40px rgba(0, 0, 0, .55);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
    }

    body {
      font-family: var(--sans);
      color: var(--ink);
      line-height: 1.55;
      font-size: 14px;
      background:
        radial-gradient(1200px 600px at 80% -10%, rgba(212, 216, 224, .05), transparent 60%),
        radial-gradient(900px 500px at 0% 10%, rgba(107, 97, 94, .08), transparent 55%),
        linear-gradient(180deg, var(--bg), var(--bg2));
      background-attachment: fixed;
      min-height: 100vh;
      padding: 0 0 4rem;
    }

    a {
      color: var(--blue);
      text-decoration: none;
    }

    .wrap {
      max-width: 2200px;
      margin: 0 auto;
      padding: clamp(16px, 2vw, 40px) clamp(16px, 2vw, 40px) 4rem;
    }

    header.mast {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
      flex-wrap: wrap;
      padding: 1.4rem 0 1.1rem;
      border-bottom: 1px solid var(--line);
      margin-bottom: 1.1rem;
    }

    .mast .lhs {
      display: flex;
      flex-direction: column;
      gap: .25rem;
    }

    .mast .eyebrow {
      font-size: .72rem;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--faint);
      font-weight: 600;
    }

    .mast h1 {
      font-size: 1.65rem;
      font-weight: 800;
      letter-spacing: -.01em;
      margin: 0;
    }

    .mast .meta {
      display: flex;
      gap: 1.4rem;
      flex-wrap: wrap;
      margin-top: .45rem;
      font-size: .82rem;
      color: var(--muted);
    }

    .mast .meta b {
      color: var(--ink);
      font-weight: 600;
    }

    .mono {
      font-family: var(--mono);
    }

    .verdict {
      display: flex;
      align-items: center;
      gap: .6rem;
      background: var(--redbg);
      border: 1px solid rgba(255, 90, 82, .45);
      color: var(--red);
      padding: .55rem .9rem;
      border-radius: 999px;
      font-weight: 800;
      letter-spacing: .04em;
      font-size: .86rem;
      white-space: nowrap;
    }

    .verdict .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--red);
      box-shadow: 0 0 0 4px rgba(255, 90, 82, .18);
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: .35
      }
    }

    .kpis {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(165px, 1fr));
      gap: .8rem;
      margin: 0 0 1.3rem;
    }

    .kpi {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: .85rem 1rem;
      position: relative;
      overflow: hidden;
    }

    .kpi::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: var(--accent, var(--blue));
    }

    .kpi .k {
      font-size: .68rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
    }

    .kpi .v {
      font-size: 1.7rem;
      font-weight: 800;
      line-height: 1.1;
      margin-top: .25rem;
      font-family: var(--mono);
      color: var(--accent, var(--ink));
    }

    .kpi .x {
      font-size: .72rem;
      color: var(--faint);
      margin-top: .2rem;
    }

    section.block {
      margin: 0 0 1.3rem;
    }

    .shead {
      display: flex;
      align-items: baseline;
      gap: .8rem;
      margin: 0 0 .7rem;
      flex-wrap: wrap;
    }

    .shead h2 {
      font-size: 1.05rem;
      font-weight: 700;
      margin: 0;
      letter-spacing: -.01em;
    }

    .shead .hint {
      font-size: .78rem;
      color: var(--faint);
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .card .ct {
      padding: .7rem 1rem;
      border-bottom: 1px solid var(--line);
      font-weight: 700;
      font-size: .86rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: .5rem;
    }

    .card .cb {
      padding: 1rem;
    }

    .card .ct .tag {
      font-family: var(--mono);
      font-size: .7rem;
      color: var(--faint);
      font-weight: 500;
    }

    /* operations layout: sticky topology + scrolling steps */
    .ops {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
      gap: 1rem;
      align-items: start;
    }

    .red-ops .red-topo {
      position: sticky;
      top: 4.5rem;
      align-self: start;
    }

    .composer-run {
      margin-top: 1rem;
      border-left: 3px solid var(--cyan);
    }

    .composer-lede {
      margin: 0 0 .85rem;
      color: var(--muted);
      font-size: .88rem;
      max-width: 72ch;
      line-height: 1.55;
    }

    .composer-disclaimer {
      margin: 0 0 1.1rem;
      padding: 1rem 1.15rem;
      border: 1px solid rgba(255, 90, 82, .55);
      border-left: 4px solid #ff5a52;
      border-radius: 8px;
      background: linear-gradient(180deg, rgba(255, 90, 82, .12), rgba(255, 90, 82, .04));
      box-shadow: 0 0 0 1px rgba(255, 90, 82, .08), 0 8px 30px rgba(255, 90, 82, .08);
      max-width: 78ch;
    }

    .composer-disclaimer .cd-head {
      display: flex;
      align-items: center;
      gap: .5rem;
      font-weight: 800;
      letter-spacing: .02em;
      color: #ff8a83;
      text-transform: uppercase;
      font-size: .82rem;
      margin-bottom: .6rem;
    }

    .composer-disclaimer .cd-icon {
      font-size: 1.05rem;
      line-height: 1;
    }

    .composer-disclaimer p {
      margin: 0 0 .6rem;
      font-size: .84rem;
      line-height: 1.6;
      color: var(--muted);
    }

    .composer-disclaimer p:last-child { margin-bottom: 0; }

    .composer-disclaimer b { color: #ffd9d6; }

    .composer-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: .65rem;
      margin: 0 0 1rem;
    }

    .composer-stat {
      background: var(--panel3);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: .55rem .7rem;
    }

    .composer-stat .k {
      font-size: .65rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--faint);
      font-weight: 600;
    }

    .composer-stat .v {
      font-family: var(--mono);
      font-size: .95rem;
      font-weight: 700;
      margin-top: .2rem;
      color: var(--cyan);
    }

    .composer-note {
      font-size: .78rem;
      color: var(--faint);
      margin: .5rem 0 0;
    }

    .composer-run details.composer-prompt {
      margin-top: .85rem;
      font-size: .82rem;
      color: var(--muted);
    }

    .composer-run details.composer-prompt summary {
      cursor: pointer;
      color: var(--faint);
      font-weight: 600;
    }

    @media(max-width:1080px) {
      .ops {
        grid-template-columns: 1fr;
      }

      .red-ops .red-topo {
        position: static;
      }
    }

    svg#topo {
      width: 100%;
      height: auto;
      display: block;
      background: radial-gradient(circle at 50% 42%, rgba(107, 97, 94, .12), transparent 72%);
      border: 1px solid var(--line2);
      border-radius: var(--radius);
      padding: .4rem 0 1.4rem;
    }

    svg#topo .node text {
      paint-order: stroke;
      stroke: rgba(3, 2, 1, .85);
      stroke-width: 2px;
      stroke-linejoin: round;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: .4rem 1rem;
      font-size: .72rem;
      color: var(--muted);
      margin-top: .5rem;
    }

    .legend i {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 3px;
      margin-right: .35rem;
      vertical-align: -1px;
    }

    .node {
      cursor: pointer;
    }

    .node circle {
      transition: .15s;
    }

    .node:hover circle {
      filter: brightness(1.18);
    }

    .node text {
      font-family: var(--sans);
      pointer-events: none;
    }

    .node.dim {
      opacity: .25;
    }

    .node.active circle {
      stroke-width: 4 !important;
      filter: drop-shadow(0 0 9px currentColor);
    }

    .node.active .ring {
      opacity: 1;
    }

    .ring {
      opacity: 0;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
      transition: .2s;
    }

    .node.active .ring {
      animation: ring 1.8s ease-out infinite;
    }

    @keyframes ring {
      0% {
        r: var(--r0);
        opacity: .7
      }

      100% {
        r: var(--r1);
        opacity: 0
      }
    }

    .edge {
      fill: none;
      stroke: var(--line2);
      stroke-width: 2;
    }

    .edge.attack {
      stroke: var(--red);
      opacity: .5;
    }

    .edge.trust {
      stroke: var(--blue);
      stroke-dasharray: 2 5;
      opacity: .7;
    }

    .edge.dim {
      opacity: .1;
    }

    .edge.active {
      opacity: 1;
      stroke-width: 3;
    }

    .edge.flow {
      stroke-dasharray: 9 7;
      animation: flow 1s linear infinite;
    }

    .edge.trust.flow {
      animation: flow 1.5s linear infinite, flowback 1.5s linear infinite;
    }

    @keyframes flow {
      to {
        stroke-dashoffset: -32;
      }
    }

    @keyframes flowback {

      0%,
      100% {
        stroke-width: 3
      }

      50% {
        stroke-width: 4.5
      }
    }

    .flowdot {
      fill: var(--red);
      opacity: 0;
    }

    .flowdot.on {
      opacity: 1;
    }

    /* context (active info) panel */
    .ctxhead {
      display: flex;
      align-items: center;
      gap: .5rem;
      flex-wrap: wrap;
    }

    .ctxhead h3 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 800;
    }

    .ctxhead .role {
      color: var(--muted);
      font-size: .8rem;
    }

    .kv {

      margin: .18rem 0;

    }

    .kv b {

    }

    .kv .mono {
      color: var(--cyan);
      font-size: .76rem;
    }

    h4.lbl {

      text-transform: uppercase;
      letter-spacing: .12em;
      color: var(--faint);
      font-weight: 700;
      margin: .9rem 0 .35rem;

      gap: .4rem;

    h4.lbl::after {

    ul.tight {
      margin: .2rem 0;
      padding-left: 0;
      list-style: none;
      font-size: .82rem;
    }

    ul.tight li {

    ul.tight li::before {

      color: var(--faint);
    }

    ul.tight li b {
      color: var(--ink);
    }

    .flag {
      color: var(--amber);
    }

    .flag.crit {
      color: var(--red);
    }

    .empty {
      color: var(--faint);
      font-style: italic;
      font-size: .85rem;
    }

    /* Cross-ref: linked (jump) vs static copy */
    .cell-static,
    .plain {
      color: var(--muted);
      font-weight: 400;
      cursor: default;
    }

    .nolink {
      color: var(--faint2);
      font-size: .72rem;
      font-weight: 400;
      cursor: default;
      opacity: .75;
    }

    .steplabel {
      color: var(--faint2);
      font-weight: 500;
      margin-right: .15rem;
    }

    .lnk {
      background: none;
      border: none;
      font: inherit;
      text-align: left;
      cursor: pointer;
      padding: 0;
      transition: .12s;
    }

    .lnk-block {
      display: inline;
      color: var(--blue);
      font-weight: 600;
      text-decoration: underline;
      text-decoration-style: dashed;
      text-underline-offset: 3px;
    }

    .lnk-block:hover {
      color: #8fc4ff;
      text-decoration-style: solid;
    }

    .lnk-pill {

      align-items: center;
      gap: .2rem;
      font-family: var(--mono);
      font-size: .72rem;

    .lnk-pill:hover {

    .lnk-pill::before {
      content: "↗";
      font-size: .65rem;
      opacity: .9;
    }

    .arrow {
      color: var(--blue);
      font-size: .78rem;
      opacity: .85;
    }

    ul.tight li .lnk-block {
      width: auto;
      max-width: 100%;
    }

    .u {
      display: flex;
      align-items: center;
      gap: .5rem;
      margin: .3rem 0;
      font-size: .82rem;
    }

    .u i {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex: 0 0 auto;
    }

    .u .uname {

      font-family: var(--mono);
      font-size: .78rem;
    }

    .u .udesc {
      color: var(--muted);
      font-size: .76rem;
    }

      font-size: .78rem;
      table-layout: auto;

      text-overflow: clip;

    }

    td.mono,

    }

      font-size: .72rem;
      color: var(--cyan);
      word-break: break-all;
    }

      border: 1px solid var(--line);
      color: var(--muted);
      white-space: nowrap;
      cursor: default;
    }

    .chip.red {
      background: var(--redbg);
      border-color: rgba(255, 90, 82, .4);
      color: var(--red);
    }

    .chip.green {
      background: var(--greenbg);
      border-color: rgba(61, 220, 132, .4);
      color: var(--green);
    }

    }

    .tabs {
      display: flex;
      gap: .4rem;
      margin: 0 0 .9rem;
      flex-wrap: wrap;
    }

    .tabs button {
      font: inherit;
      font-size: .8rem;
      font-weight: 600;
      padding: .4rem .85rem;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--muted);
      border-radius: 8px;
      cursor: pointer;
      transition: .12s;
    }

    .tabs button:hover {
      color: var(--ink);
    }

    .tabs button.on {
      background: var(--bluebg);
      color: var(--blue);
      border-color: rgba(74, 163, 255, .5);
    }

    .steps {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: .5rem;
    }

    .step {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
      overflow: hidden;
      transition: .12s;
    }

    .step.sel {
      border-color: var(--red);
      box-shadow: 0 0 0 1px var(--red);
    }

    .step .hd {
      display: flex;
      gap: .7rem;
      align-items: center;
      padding: .55rem .7rem;
      cursor: pointer;
    }

    .step .hd:hover {
      background: var(--panel2);
    }

    .step .num {
      flex: 0 0 auto;
      width: 1.7rem;
      height: 1.7rem;
      border-radius: 8px;
      background: var(--panel2);
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .78rem;
      font-weight: 700;
      font-family: var(--mono);
    }

    .step.sel .num {
      background: var(--red);
      color: #fff;
      border-color: var(--red);
    }

    .step .t {
      font-size: .84rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: .45rem;
      flex-wrap: wrap;
    }

    .step .m {
      font-size: .7rem;
      color: var(--faint);
      margin-top: .1rem;
      font-family: var(--mono);
    }

    .step .body {
      display: none;
      padding: 0 .7rem .7rem 3.1rem;
    }

    .step.open .body {
      display: block;
    }

    pre.cmd {
      font-family: var(--mono);
      font-size: .74rem;
      background: var(--bg);
      color: var(--muted);
      border: 1px solid var(--line2);
      border-left: 3px solid var(--brand);
      padding: .6rem .7rem .6rem 1.7rem;
      border-radius: var(--radius);
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-word;
      margin: .45rem 0;
      line-height: 1.55;
      position: relative;
    }

    pre.cmd::before {
      content: "$";
      position: absolute;
      left: .65rem;
      top: .6rem;
      color: var(--brand);
      font-weight: 700;
    }

    pre.cmd .tok {
      color: var(--ink);
      font-weight: 600;
    }

    code.inl {
      font-family: var(--mono);
      font-size: .92em;
      background: var(--panel2);
      border: 1px solid var(--line2);
      border-radius: 4px;
      padding: .02rem .32rem;
      color: var(--cyan);
      word-break: break-word;
    }

    .loot {
      font-size: .78rem;
      color: var(--green);
      margin: .3rem 0;
    }

    .loot b {
      color: var(--green);
    }

    .steplinks {
      margin-top: .35rem;
      font-size: .76rem;
      color: var(--faint2);
    }

    .narr-toggle {
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: .3rem;
      color: var(--blue);
      font-weight: 600;
      font-size: .78rem;
      margin-top: .4rem;
      border: 1px solid rgba(74, 163, 255, .35);
      padding: .3rem .6rem;
      border-radius: var(--radius);
      background: var(--bluebg);
    }

    .narr-toggle:hover {
      background: var(--panel3);
    }

    .narr-toggle i {
      transition: .15s;
      font-style: normal;
    }

    .narr-toggle.open i {
      transform: rotate(90deg);
    }

    .narr-body {
      display: none;
      margin-top: .6rem;
      padding: .8rem;
      background: var(--panel3);
      border: 1px solid var(--line2);
      border-radius: 8px;
      font-size: .83rem;
      line-height: 1.55;
      color: var(--ink);
    }

    .narr-body.open {
      display: block;
    }

    details.proof {
      margin: .55rem 0 0;
      border: 1px solid var(--line2);
      border-radius: 8px;
      background: var(--panel3);
      overflow: hidden;
    }

    details.proof summary {
      cursor: pointer;
      padding: .45rem .65rem;
      font-size: .76rem;
      font-weight: 600;
      color: var(--muted);
      list-style: none;
      display: flex;
      align-items: center;
      gap: .4rem;
    }

    details.proof summary::-webkit-details-marker {
      display: none;
    }

    details.proof summary::before {
      content: "▸";
      color: var(--faint);
      transition: .15s;
    }

    details.proof[open] summary::before {
      transform: rotate(90deg);
    }

    details.proof summary:hover {
      color: var(--ink);
    }

    details.proof .proof-inner {
      padding: 0 .65rem .65rem;
    }

    details.proof figcaption {
      font-size: .72rem;
      color: var(--faint);
      margin: 0 0 .35rem;
      line-height: 1.4;
    }

    details.proof .proof-credit {
      display: block;
      margin-top: .25rem;
      font-size: .65rem;
      color: var(--faint);
      font-style: italic;
      letter-spacing: .02em;
    }

    details.proof .proof-img-btn {
      margin: 0;
      padding: 0;
      border: none;
      background: none;
      cursor: zoom-in;
      display: block;
      width: 100%;
      text-align: left;
    }

    details.proof .proof-img-btn:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 3px;
      border-radius: 6px;
    }

    .step .step-sum {
      font-size: .8rem;
      color: var(--muted);
      margin: .35rem 0 .5rem;
      line-height: 1.5;
    }

    details.proof .proof-inner .proof-img-btn img {
      cursor: zoom-in;
    }

    details.proof img {
      max-width: 100%;
      height: auto;
      border-radius: 6px;
      border: 1px solid var(--line);
      display: block;
      background: var(--bg);
      pointer-events: none;
    }

    details.proof figure {
      margin: 0 0 .75rem;
    }

    details.proof figure:last-child {
      margin-bottom: 0;
    }

    #imgLightbox {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(3, 2, 1, .88);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.25rem;
      cursor: zoom-out;
    }

    #imgLightbox.open {
      display: flex;
    }

    #imgLightbox img {
      max-width: min(96vw, 2400px);
      max-height: 92vh;
      width: auto;
      height: auto;
      border-radius: 8px;
      border: 1px solid var(--line2);
      box-shadow: 0 12px 48px rgba(0, 0, 0, .55);
      cursor: default;
    }

    #imgLightbox .lb-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      width: 2.25rem;
      height: 2.25rem;
      border: 1px solid var(--line2);
      border-radius: 8px;
      background: var(--panel2);
      color: var(--ink);
      font-size: 1.35rem;
      line-height: 1;
      cursor: pointer;
    }

    #imgLightbox .lb-close:hover {
      background: var(--panel3);
    }

    .ph {
      font-size: .6rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      padding: .12rem .42rem;
      border-radius: 5px;
      font-weight: 700;
      border: 1px solid;
    }

    .ph-foothold {
      color: var(--blue);
      border-color: rgba(74, 163, 255, .45);
      background: var(--bluebg);
    }

    .ph-child {
      color: var(--amber);
      border-color: rgba(255, 176, 32, .45);
      background: var(--amberbg);
    }

    .ph-forest {
      color: var(--red);
      border-color: rgba(255, 90, 82, .45);
      background: var(--redbg);
    }

    .ph-persist {
      color: var(--purple);
      border-color: rgba(176, 139, 255, .45);
      background: var(--purplebg);
    }

    /* secrets vault — max 2 columns so Unlocks/Use columns stay readable */
    .vault {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.2rem;
    }

    @media (min-width:1100px) {
      .vault {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    .vcard {
      border: 1px solid var(--line2);
      border-radius: var(--radius);
      background: var(--panel);
      overflow: visible;
    }

    .vcard .vt {
      padding: .65rem .9rem;
      border-bottom: 1px solid var(--line2);
      font-weight: 700;
      font-size: .82rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--panel2);
      letter-spacing: .02em;
    }

    .vcard .vb {
      padding: .55rem .65rem .75rem;
      overflow-x: auto;
    }

    .secret {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      cursor: pointer;
      font-family: var(--mono);
      font-size: .72rem;
    }

    .secret .mask {
      background: var(--amberbg);
      border: 1px dashed rgba(255, 176, 32, .55);
      border-radius: 5px;
      padding: .05rem .5rem;
      color: var(--amber);
      letter-spacing: .06em;
      font-weight: 600;
    }

    .secret:hover .mask {
      background: rgba(255, 176, 32, .18);
    }

    .secret.shown .mask {
      display: none;
    }

    .secret .val {
      display: none;
      color: var(--cyan);
      word-break: break-all;
    }

    .secret.shown .val {
      display: inline;
    }

    .reveal-all {
      font: inherit;
      font-size: .7rem;
      font-weight: 600;
      padding: .2rem .6rem;
      border: 1px solid var(--line);
      background: var(--panel2);
      color: var(--muted);
      border-radius: 6px;
      cursor: pointer;
    }

    .reveal-all:hover {
      color: var(--blue);
    }

    /* hardening */
    .hard {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 1rem;
    }

    .hcard {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      overflow: hidden;
      transition: .12s;
      scroll-margin-top: 1rem;
    }

    .hcard.open {
      grid-column: 1 / -1;
    }

    .hcard .hh {
      padding: .7rem .85rem;
      cursor: pointer;
      display: flex;
      gap: .6rem;
      align-items: flex-start;
      justify-content: space-between;
    }

    .hcard .hh:hover {
      background: var(--panel2);
    }

    .hcard .htitle {
      font-size: .88rem;
      font-weight: 700;
    }

    .hcard .hmeta {
      font-size: .7rem;
      color: var(--faint);
      margin-top: .2rem;
      font-family: var(--mono);
    }

    .evstamp {
      font-size: .62rem;
      letter-spacing: .04em;
      padding: .18rem .5rem;
      border-radius: 6px;
      border: 1px solid;
      white-space: nowrap;
      font-weight: 700;
    }

    .ev-on {
      color: var(--green);
      border-color: rgba(61, 220, 132, .45);
      background: var(--greenbg);
    }

    .ev-gap {
      color: var(--red);
      border-color: rgba(255, 90, 82, .45);
      background: var(--redbg);
    }

    .hcard .hbody {
      display: none;
      padding: .2rem .85rem .9rem;
      border-top: 1px solid var(--line);
    }

    .hcard.open .hbody {
      display: block;
    }

    .hcard.open .hbody .hgrid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr);
      gap: 1.1rem;
    }

    @media(max-width:900px) {
      .hcard.open .hbody .hgrid {
        grid-template-columns: 1fr;
      }
    }

    .why {
      font-size: .82rem;
      margin: .55rem 0;
      color: var(--muted);
    }

    .why b {
      color: var(--ink);
    }

    .fix {
      font-size: .82rem;
      margin: .5rem 0;
      padding: .5rem .65rem;
      border-left: 3px solid var(--green);
      background: var(--greenbg);
      border-radius: 0 8px 8px 0;
    }

    .fix b {
      color: var(--green);
    }

    .qbox {
      font-family: var(--mono);
      font-size: .74rem;
      background: var(--bg);
      color: var(--muted);
      padding: .55rem .7rem;
      border-radius: var(--radius);
      white-space: pre-wrap;
      word-break: break-word;
      margin: .3rem 0;
      border: 1px solid var(--line2);
      line-height: 1.55;
    }

    .src {
      font-size: .7rem;
      color: var(--faint);
      margin-top: .5rem;
    }

    .src b {
      color: var(--muted);
    }

    .xref {
      display: flex;
      flex-wrap: wrap;
      gap: .35rem;
      margin: .4rem 0;
    }

    button.xchip,
    .xchip {
      font: inherit;
      font-size: .7rem;
      padding: .22rem .6rem;
      border-radius: 999px;
      background: var(--bluebg);
      border: 1px solid rgba(74, 163, 255, .5);
      color: var(--blue);
      font-weight: 700;
      cursor: pointer;
      transition: .12s;
    }

    button.xchip:hover,
    .xchip:hover {
      background: rgba(74, 163, 255, .22);
      border-color: var(--blue);
    }

    table.ev td.col-from .from-cell {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: .35rem;
    }

    /* hardening consensus (collaboration signal) */
    .hstamps {
      display: flex;
      flex-direction: column;
      gap: .32rem;
      align-items: flex-end;
      flex: 0 0 auto;
    }

    .cons {
      font-size: .6rem;
      letter-spacing: .05em;
      text-transform: uppercase;
      padding: .16rem .5rem;
      border-radius: 999px;
      border: 1px solid;
      white-space: nowrap;
      font-weight: 700;
      display: inline-flex;
      gap: .3rem;
      align-items: center;
    }

    .cons-req {
      color: var(--green);
      border-color: rgba(61, 220, 132, .5);
      background: var(--greenbg);
    }

    .cons-deb {
      color: var(--amber);
      border-style: dashed;
      border-color: rgba(255, 176, 32, .6);
      background: var(--amberbg);
    }

    .hcard.req {
      border-left: 3px solid var(--green);
    }

    .hcard.deb {
      border-left: 3px dashed var(--amber);
    }

    .debate-note {
      font-size: .8rem;
      margin: .55rem 0;
      padding: .5rem .65rem;
      border-left: 3px dashed var(--amber);
      background: var(--amberbg);
      border-radius: 0 var(--radius) var(--radius) 0;
      color: var(--muted);
    }

    .debate-note b {
      color: var(--amber);
    }

    .logctx {
      font-size: .82rem;
      margin: .55rem 0;
      padding: .5rem .65rem;
      border-left: 3px solid var(--brand);
      background: var(--panel2);
      border-radius: 0 var(--radius) var(--radius) 0;
      color: var(--muted);
      line-height: 1.5;
    }

    .logctx b {
      color: var(--ink);
    }

    .consensus-legend {
      display: flex;
      gap: 1.1rem;
      flex-wrap: wrap;
      font-size: .74rem;
      color: var(--faint);
      align-items: center;
    }

    /* mini topology strip inside cards */
    .htopo-wrap {
      margin: .2rem 0 .9rem;
    }

    svg.mtopo {
      width: 100%;
      height: auto;
      display: block;
      background: radial-gradient(circle at 50% 50%, rgba(107, 97, 94, .1), transparent 75%);
      border: 1px solid var(--line2);
      border-radius: var(--radius);
      padding: .3rem .15rem;
    }

    svg.mtopo text {
      paint-order: stroke;
      stroke: rgba(3, 2, 1, .9);
      stroke-width: 1.6px;
      stroke-linejoin: round;
    }

    .mtopo .mn-name {
      font-family: var(--sans);
      fill: var(--muted);
      font-weight: 600;
    }

    .mtopo .mn-sub {
      font-family: var(--mono);
      fill: var(--faint);
    }

    .mtopo .mlabel {
      font-family: var(--mono);
    }

    .topo-val-tbl .ok {
      color: var(--green);
      font-weight: 700;
    }

    .topo-val-tbl .extra {
      color: var(--blue);
      font-weight: 600;
    }

    .topo-val-tbl .bad {
      color: var(--red);
      font-weight: 700;
    }

    .topo-validate .kv {
      margin-bottom: .85rem;
      line-height: 1.55;
    }

    .medge {
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
    }

    .medge.atk {
      stroke: var(--red);
    }

    .medge.gap {
      stroke: var(--red);
      opacity: .5;
    }

    .medge.trust {
      stroke: var(--blue);
    }

    .medge.flow {
      stroke-dasharray: 8 6;
      animation: mflow 1s linear infinite;
    }

    .medge.trust.flow {
      animation: mflow 1.3s linear infinite;
    }

    .medge.gap.flow {
      animation: mflow 1.5s linear infinite;
    }

    @keyframes mflow {
      to {
        stroke-dashoffset: -28;
      }
    }

    .mtag {
      font-size: .62rem;
      color: var(--faint2);
      letter-spacing: .04em;
      margin: .15rem 0 .35rem;
    }

    .mtag .gapdot {
      color: var(--red);
    }

    .mtag .okdot {
      color: var(--red);
    }

    .flash {
      animation: flash 1.8s ease;
    }

    @keyframes flash {
      0% {
        box-shadow: 0 0 0 2px var(--amber), 0 0 22px rgba(255, 176, 32, .5);
      }

      100% {
        box-shadow: var(--shadow);
      }
    }

    /* riddle vault */
    .riddle-card {
      border: 1px solid var(--line2);
      border-radius: var(--radius);
      background: var(--panel);
      overflow: hidden;
      transition: .2s;
    }

    .riddle-card.unlocked {
      border-color: var(--green);
      box-shadow: 0 0 0 1px var(--green);
    }

    .riddle-hd {
      padding: .75rem .9rem;
      display: flex;
      align-items: center;
      gap: .7rem;
      border-bottom: 1px solid var(--line2);
      background: var(--panel2);
    }

    .riddle-hd .r-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      flex: 0 0 auto;
    }

    .riddle-hd .r-name {
      font-weight: 700;
      font-size: .88rem;
    }

    .riddle-hd .r-role {
      font-size: .72rem;
      color: var(--faint);
      font-family: var(--mono);
    }

    .riddle-body {
      padding: .75rem .9rem;
    }

    .riddle-quote {
      font-style: italic;
      font-size: .88rem;
      color: var(--muted);
      margin: 0 0 .6rem;
      line-height: 1.5;
    }

    .riddle-quote .blank {
      display: inline-block;
      min-width: 5rem;
      border-bottom: 2px dashed var(--amber);
      color: var(--amber);
      font-style: normal;
      font-weight: 700;
      text-align: center;
      padding: 0 .3rem;
    }

    .riddle-input {
      display: flex;
      gap: .4rem;
      align-items: center;
    }

    .riddle-input input {
      font: inherit;
      font-size: .82rem;
      font-family: var(--mono);
      padding: .35rem .6rem;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--ink);
      border-radius: var(--radius);
      width: 12rem;
    }

    .riddle-input input:focus {
      outline: none;
      border-color: var(--blue);
    }

    .riddle-input button {
      font: inherit;
      font-size: .72rem;
      font-weight: 700;
      padding: .35rem .7rem;
      border: 1px solid var(--line);
      background: var(--panel2);
      color: var(--muted);
      border-radius: var(--radius);
      cursor: pointer;
    }

    .riddle-input button:hover {
      color: var(--ink);
      border-color: var(--blue);
    }

    .riddle-secrets {
      display: none;
      margin-top: .7rem;
      padding-top: .6rem;
      border-top: 1px solid var(--line2);
    }

    .riddle-card.unlocked .riddle-secrets {
      display: block;
    }

    .riddle-card.unlocked .riddle-input {
      display: none;
    }

    .riddle-card.unlocked .riddle-quote .blank {
      border-bottom-color: var(--green);
      color: var(--green);
    }

    .riddle-wrong {
      color: var(--red);
      font-size: .72rem;
      margin-left: .4rem;
      opacity: 0;
      transition: .2s;
    }

    .riddle-wrong.show {
      opacity: 1;
    }

    .team-tabs {
      display: flex;
      gap: .55rem;
      flex-wrap: wrap;
      margin: 0;
    }

    .team-tab {
      font: inherit;
      font-weight: 800;
      font-size: .78rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      border: 1px solid var(--line2);
      color: var(--muted);
      background: var(--panel);
      border-radius: 999px;
      padding: .5rem .9rem;
      cursor: pointer;
    }

    .team-tab.red.on {
      color: var(--red);
      border-color: rgba(255, 90, 82, .6);
      background: var(--redbg);
    }

      let ctx = null, on = false;

      function blip(freqs, dur, type, peak) {
        if (!on || reduced) return;

      s += `<h4 class="lbl">Real signal</h4><div class="kv">${ esc(k.real_signal || "") }</div>`;
      if (k.samples && k.samples.length) {
        s += `<h4 class="lbl">Sample events (first 3)</h4><table class="ev"><tr><th>Timestamp</th><th>Agent</th><th>Rule</th><th>Event</th><th>User</th><th>Source IP</th></tr>`;
        k.samples.slice(0, 3).forEach(r => s += `<tr><td>${ esc(r[0]) }</td><td>${ esc(r[1]) }</td><td>${ esc(r[2]) }</td><td>${ esc(r[3]) }</td><td class="mono">${ esc(r[4]) }</td><td class="mono">${ esc(r[5]) }</td></tr>`);
        s += `</table>`;
      }
      $("#kerbnoise").innerHTML = s;
    }

    /* ---------- cross-link jumps ---------- */
    function flash(el) { if (!el) return; el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); }
    function jumpHard(id) { const c = document.querySelector(`.hcard[data-id="${ id }"]`); if (!c) return; c.classList.add("open"); c.querySelector(".hh")?.setAttribute("aria-expanded", "true"); c.scrollIntoView({ behavior: "smooth", block: "center" }); flash(c); }
    function jumpHost(id) { showHost(id); const card = $("#topo").closest(".card"); card.scrollIntoView({ behavior: "smooth", block: "start" }); flash(card); }
    function initTeamTabs() {
      const tabs = $$(".team-tab");
      function activate(btn, focus) {
        const team = btn.dataset.team;
        tabs.forEach(b => {
          const sel = b === btn;
          b.classList.toggle("on", sel);
          b.setAttribute("aria-selected", sel ? "true" : "false");
          b.tabIndex = sel ? 0 : -1;
        });
        $$(".team-panel").forEach(p => {
          const show = p.id === team + "Team";
          p.classList.toggle("on", show);
          p.hidden = !show;
        });
        if (focus) btn.focus();
        SFX.tick();
      }
      tabs.forEach((btn, i) => {
        btn.addEventListener("click", () => activate(btn));
        btn.addEventListener("keydown", e => {
          let next = null;
          if (e.key === "ArrowRight" || e.key === "ArrowDown") next = tabs[(i + 1) % tabs.length];
          else if (e.key === "ArrowLeft" || e.key === "ArrowUp") next = tabs[(i - 1 + tabs.length) % tabs.length];
          else if (e.key === "Home") next = tabs[0];
          else if (e.key === "End") next = tabs[tabs.length - 1];
          if (next) { e.preventDefault(); activate(next, true); }
        });
      });
    }
    function initSoundToggle() {
      const btn = $("#soundToggle");
      if (!btn) return;
      const saved = (() => { try { return localStorage.getItem("goad-sfx") === "1"; } catch (e) { return false; } })();
      const apply = state => {
        SFX.set(state);
        btn.setAttribute("aria-pressed", state ? "true" : "false");
        btn.querySelector(".sound-lbl").textContent = state ? "Sound on" : "Sound off";
        try { localStorage.setItem("goad-sfx", state ? "1" : "0"); } catch (e) { }
      };
      apply(saved);
      btn.addEventListener("click", () => { const next = !SFX.on; apply(next); if (next) SFX.chime(); });
    }
    /* Make a non-button element behave like a button for keyboard users. */
    function makeActivatable(el, fn) {
      if (!el) return;
      el.setAttribute("role", "button");
      el.tabIndex = 0;
      el.addEventListener("click", fn);
      el.addEventListener("keydown", e => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fn(e); }
      });
    }

    /* ---------- init ---------- */
    renderLegend(); buildTopo();
    renderDomTabs(); renderDomPanel();
    renderKerbNoise();
    renderVault(); renderReportSteps(); renderHard(); renderPurpleWriteup(); renderComposerRun();
    initTeamTabs();
    initSoundToggle();
    initImgLightbox();
    // Soft "capture" tick when an analyst reveals a looted secret (multisensory confirmation).
    document.addEventListener("click", e => { if (e.target.closest(".secret")) SFX.tick(); });
    (function () { const m = (location.hash || "").match(/open=([\w]+)/); if (m) { const c = document.querySelector(`.hcard[data-id="${ m[1] }"]`); if (c) { c.classList.add("open"); c.querySelector(".hh")?.setAttribute("aria-expanded", "true"); c.scrollIntoView({ block: "center" }); } } })();
  </script>
</body>

</html>
